<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Display</title>

  <style>
    :root {
      --primary-color: #005a9c;
      --primary-hover: #003e6b;
      --card-bg: #ffffff;
      --hero-bg: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --tag-bg: #e2e8f0;
      --tag-text: #334155;
      --border-color: #cbd5e1;
      --focus-ring: #0284c7;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.15);
      --radius-lg: 16px;
      --radius-md: 8px;
      --radius-pill: 9999px;
      --grid-gap: 28px;
      --thumb-gap: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      color: var(--text-main);
      padding: 24px 16px;
      margin: 0;
      line-height: 1.5;
    }

    .bento-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .widget-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 24px 0;
      border-left: 5px solid var(--primary-color);
      padding-left: 16px;
    }

    /* Bento Container Grid Layout */
    .bento-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--grid-gap);
      align-items: start; /* Enables smooth sticky positioning */
    }

    /* Responsive Sticky Layout for Desktop & Tablets */
    @media (min-width: 880px) {
      .bento-container {
        grid-template-columns: 380px 1fr;
      }

      /* Requirement #2: Sticky Large Hero Card */
      .bento-hero {
        position: sticky;
        top: 24px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
      }
    }

    /* Hero Spotlight Card */
    .bento-hero {
      background: var(--hero-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .hero-cover-wrapper {
      width: 100%;
      max-width: 210px;
      aspect-ratio: 2/3;
      overflow: hidden;
      border-radius: var(--radius-md);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      margin-bottom: 16px;
      background: #cbd5e1;
    }

    .hero-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .hero-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 6px 0;
      line-height: 1.3;
    }

    .hero-callnumber {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary-color);
      background: #e0f2fe;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      margin: 0 0 16px 0;
      display: inline-block;
    }

    /* Requirement #4: Go to Catalog Button */
    .hero-btn {
      display: inline-block;
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 20px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .hero-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .hero-btn:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Requirement #5: Subjects & Description */
    .hero-details {
      width: 100%;
      text-align: left;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .meta-group {
      margin-bottom: 16px;
    }

    .meta-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .subject-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .subject-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      line-height: 1.3;
    }

    .hero-description {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Scrollbars for hero card and description */
    .hero-description::-webkit-scrollbar,
    .bento-hero::-webkit-scrollbar {
      width: 5px;
    }
    .hero-description::-webkit-scrollbar-thumb,
    .bento-hero::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }

    /* Thumbnail Grid Side */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: var(--thumb-gap);
      align-content: start;
    }

    @media (max-width: 480px) {
      .bento-grid {
        grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      }
    }

    .thumb-card {
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      outline: none;
      position: relative;
    }

    .thumb-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-color);
    }

    .thumb-card:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
      border-color: var(--primary-color);
    }

    .thumb-card.active {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px var(--primary-color);
      background-color: #f0f7ff;
    }

    .thumb-cover-wrapper {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 4px;
      overflow: hidden;
      background: #e2e8f0;
    }

    .thumb-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="bento-wrapper">
  <h2 class="widget-title">Promoted Collection</h2>
  
  <div class="bento-container" id="bentoContainer">
    <!-- Hero Spotlight Side (Sticky Desktop Card) -->
    <section class="bento-hero" id="bentoHero" aria-live="polite" aria-label="Selected book details">
      <div class="hero-cover-wrapper">
        <img class="hero-cover-img" id="heroImg" src="" alt="Featured book cover" />
      </div>
      <h3 class="hero-title" id="heroTitle">Loading Collection...</h3>
      <div class="hero-callnumber" id="heroCallNumber" style="display: none;"></div>

      <!-- Requirement #4: Catalog Link Button -->
      <a class="hero-btn" id="heroLink" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">
        Go to the Catalog
      </a>

      <!-- Requirement #5: Metadata Sections -->
      <div class="hero-details" id="heroDetails" style="display: none;">
        <div class="meta-group" id="subjectsGroup">
          <span class="meta-label">Subjects</span>
          <div class="subject-tags" id="heroSubjects"></div>
        </div>

        <div class="meta-group" id="descriptionGroup">
          <span class="meta-label">Description</span>
          <p class="hero-description" id="heroDescription"></p>
        </div>
      </div>
    </section>

    <!-- Thumbnail Grid Side -->
    <main class="bento-grid" id="bentoGrid" role="region" aria-label="Book collection thumbnails">
      <div class="status-msg" id="statusMsg">Loading and validating books from books_enriched.json...</div>
    </main>
  </div>
</div>

<script>
  const JSON_FILE_PATH = 'books_enriched.json';
  let validBooks = [];

  // Asynchronously validates that an image URL exists and actually loads
  function validateImageUrl(url) {
    return new Promise((resolve) => {
      if (!url || typeof url !== 'string' || !url.trim().startsWith('http')) {
        resolve(false);
        return;
      }
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url.trim();
    });
  }

  async function loadEnrichedBooks() {
    const grid = document.getElementById('bentoGrid');
    const statusMsg = document.getElementById('statusMsg');

    try {
      const response = await fetch(JSON_FILE_PATH);
      if (!response.ok) {
        throw new Error(`Unable to fetch JSON file at "${JSON_FILE_PATH}".`);
      }

      const rawBooks = await response.json();
      if (!Array.isArray(rawBooks) || rawBooks.length === 0) {
        statusMsg.textContent = 'No records found in books_enriched.json.';
        return;
      }

      // Requirement #3: Validate image URLs concurrently
      const validationResults = await Promise.all(
        rawBooks.map(async (book) => {
          const coverUrl = (book.img_url || '').trim();
          const isValid = await validateImageUrl(coverUrl);
          if (isValid) {
            return {
              title: (book.title || 'Untitled Record').trim(),
              callNumber: (book.callNumber || '').trim(),
              permalink: (book.permalink || '#').trim(),
              isbn: (book.isbn || '').trim(),
              subjects: Array.isArray(book.subjects) ? book.subjects : [],
              description: (book.description || '').trim(),
              coverUrl: coverUrl
            };
          }
          return null;
        })
      );

      validBooks = validationResults.filter(Boolean);

      if (validBooks.length === 0) {
        statusMsg.textContent = 'No books with valid, reachable cover images were found.';
        return;
      }

      grid.innerHTML = ''; // Clear status message

      // Render thumbnails
      validBooks.forEach((book, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `thumb-card ${index === 0 ? 'active' : ''}`;
        button.setAttribute('aria-label', `Select title: ${book.title}`);
        button.setAttribute('aria-selected', index === 0 ? 'true' : 'false');

        button.onclick = () => updateHeroSpotlight(index);

        button.innerHTML = `
          <div class="thumb-cover-wrapper">
            <img class="thumb-cover-img" src="${book.coverUrl}" alt="" loading="lazy" />
          </div>
        `;

        grid.appendChild(button);
      });

      // Accessible arrow key grid navigation
      setupKeyboardGridNavigation();

      // Initialize Hero Spotlight card with the first valid book
      updateHeroSpotlight(0);

    } catch (err) {
      console.error(err);
      statusMsg.textContent = `Error loading "${JSON_FILE_PATH}". Ensure the file is present in the root directory.`;
    }
  }

  // Update Hero Spotlight dynamically
  function updateHeroSpotlight(index) {
    const book = validBooks[index];
    if (!book) return;

    const heroImg = document.getElementById('heroImg');
    heroImg.style.opacity = '0.2';

    setTimeout(() => {
      heroImg.src = book.coverUrl;
      heroImg.alt = `Cover artwork for ${book.title}`;
      document.getElementById('heroTitle').textContent = book.title;

      // Call Number badge display
      const callNumEl = document.getElementById('heroCallNumber');
      if (book.callNumber) {
        callNumEl.textContent = book.callNumber;
        callNumEl.style.display = 'inline-block';
      } else {
        callNumEl.style.display = 'none';
      }

      // Requirement #4: Go to Catalog Link Button
      const heroLink = document.getElementById('heroLink');
      if (book.permalink && book.permalink !== '#') {
        heroLink.href = book.permalink;
        heroLink.style.display = 'block';
      } else {
        heroLink.style.display = 'none';
      }

      // Requirement #5: Subjects Tags
      const subjectsGroup = document.getElementById('subjectsGroup');
      const subjectsContainer = document.getElementById('heroSubjects');
      subjectsContainer.innerHTML = '';

      if (book.subjects && book.subjects.length > 0) {
        book.subjects.forEach(sub => {
          const tag = document.createElement('span');
          tag.className = 'subject-tag';
          tag.textContent = sub.trim();
          subjectsContainer.appendChild(tag);
        });
        subjectsGroup.style.display = 'block';
      } else {
        subjectsGroup.style.display = 'none';
      }

      // Requirement #5: Description Block
      const descriptionGroup = document.getElementById('descriptionGroup');
      const descriptionEl = document.getElementById('heroDescription');
      if (book.description) {
        descriptionEl.textContent = book.description;
        descriptionGroup.style.display = 'block';
      } else {
        descriptionGroup.style.display = 'none';
      }

      document.getElementById('heroDetails').style.display = 'block';
      heroImg.style.opacity = '1';
    }, 120);

    // Toggle active visual & screen reader state
    const cards = document.querySelectorAll('.thumb-card');
    cards.forEach((card, i) => {
      const isActive = i === index;
      card.classList.toggle('active', isActive);
      card.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  }

  // Keyboard Navigation (Arrow Keys)
  function setupKeyboardGridNavigation() {
    const grid = document.getElementById('bentoGrid');
    grid.addEventListener('keydown', (e) => {
      const cards = Array.from(grid.querySelectorAll('.thumb-card'));
      const activeElement = document.activeElement;
      const index = cards.indexOf(activeElement);

      if (index === -1) return;

      let targetIndex = null;
      const columns = Math.floor(grid.clientWidth / 120) || 1;

      switch (e.key) {
        case 'ArrowRight':
          targetIndex = (index + 1) % cards.length;
          break;
        case 'ArrowLeft':
          targetIndex = (index - 1 + cards.length) % cards.length;
          break;
        case 'ArrowDown':
          targetIndex = Math.min(index + columns, cards.length - 1);
          break;
